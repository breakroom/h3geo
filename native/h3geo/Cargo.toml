[package]
name = "h3geo"
version = "0.1.0"
authors = []
edition = "2024"

[lib]
name = "h3geo"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.38.0", default-features = false, features = [
  "derive",
] }
h3o = { version = "0.11.0", features = ["std", "geo"] }
geo = "0.33.1"
itertools = "0.15.0"

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
